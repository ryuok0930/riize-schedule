:root {

  --purple-300: #c4b5fd;
  --purple-200: #ddd6fe;
  --purple-100: #ede9fe;

  --radius-sm: 10px;

}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  background: var(--gradient-bg);
  background-size: 400% 400%;
  animation: bgShift 15s ease infinite;
  color: var(--purple-900);
  min-height: 100vh;
  overflow-x: hidden;
}
@keyframes bgShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* ===== 欢迎封面（弹窗样式 1:1） ===== */
#welcome-cover {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100vh;
  background: rgba(76, 29, 149, 0.85);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}
#welcome-cover.hidden {
  opacity: 0;
  visibility: hidden;
}
.welcome-modal {
  width: 400px;
  height: 400px;
  background: white;
  border-radius: var(--radius-xl);
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  overflow: hidden;
  position: relative;
  animation: modalPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes modalPop {
  0% { opacity: 0; transform: scale(0.7); }
  100% { opacity: 1; transform: scale(1); }
}
.welcome-modal-img {
  width: 100%;
  height: 100%;
  background: url('assets/cover.jpg') center/contain no-repeat;
  position: absolute;
  top: 0; left: 0;
}
.welcome-modal-overlay {
  position: absolute;
  bottom: 0; left: 0;
  width: 100%;
  height: 55%;
  background: linear-gradient(to top, rgba(76, 29, 149, 0.95) 0%, rgba(76, 29, 149, 0.7) 60%, transparent 100%);
}
.welcome-modal-content {
  position: absolute;
  bottom: 0; left: 0;
  width: 100%;
  padding: 28px 24px 24px;
  text-align: center;
  z-index: 2;
}
.welcome-modal-title {
  font-size: 32px;
  font-weight: 800;
  color: #fff;
  letter-spacing: 6px;
  text-shadow: 0 2px 15px rgba(0,0,0,0.3);
  margin-bottom: 8px;
}
.welcome-modal-subtitle {
  font-size: 13px;
  color: rgba(255,255,255,0.9);
  letter-spacing: 3px;
  margin-bottom: 18px;
}
.welcome-modal-btn {
  padding: 12px 40px;
  background: rgba(255,255,255,0.2);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255,255,255,0.5);
  border-radius: 50px;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 3px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.welcome-modal-btn:hover {
  background: rgba(255,255,255,0.35);
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}
.welcome-deco {
  position: absolute;
  font-size: 20px;
  opacity: 0.6;
  animation: welcomeFloat 3s ease-in-out infinite;
}
.welcome-deco.d1 { top: -15px; right: -15px; animation-delay: 0s; font-size: 30px; }
.welcome-deco.d2 { bottom: 90px; left: -10px; animation-delay: 1s; font-size: 24px; }
@keyframes welcomeFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-10px) rotate(10deg); }
}

.floating-deco {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  opacity: 0.15;
  animation: float 6s ease-in-out infinite;
}
.floating-deco.d1 { top: 10%; left: 5%; font-size: 60px; animation-delay: 0s; }
.floating-deco.d2 { top: 20%; right: 8%; font-size: 50px; animation-delay: 1s; }
.floating-deco.d3 { bottom: 15%; left: 10%; font-size: 55px; animation-delay: 2s; }
.floating-deco.d4 { bottom: 25%; right: 5%; font-size: 45px; animation-delay: 3s; }
.floating-deco.d5 { top: 50%; left: 3%; font-size: 40px; animation-delay: 4s; }
.floating-deco.d6 { top: 60%; right: 3%; font-size: 50px; animation-delay: 5s; }
@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-20px) rotate(10deg); }
}
